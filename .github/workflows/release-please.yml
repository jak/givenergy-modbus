on:
  push:
    branches:
      - main

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - name: Add npm and docs links to release notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag_name }}"
          VERSION="${{ steps.release.outputs.version }}"
          BODY=$(gh release view "$TAG" --json body -q .body)
          printf -v FOOTER '\n\n---\n\n**npm:** [`givenergy-modbus@%s`](https://www.npmjs.com/package/givenergy-modbus/v/%s)\n**Docs:** [jak.github.io/givenergy-modbus](https://jak.github.io/givenergy-modbus/)' "$VERSION" "$VERSION"
          gh release edit "$TAG" --notes "${BODY}${FOOTER}"

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm publish
